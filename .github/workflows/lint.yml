name: Lint frontmatter

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Skill & command frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SKILL.md and command frontmatter
        run: python3 scripts/lint-frontmatter.py
